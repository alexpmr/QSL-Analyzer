name: Build and release (Windows, Linux, macOS)
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Validate sources and engine
        run: |
          npm run check
          npm test
      - name: Read application version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Plataformas desta versão em .github/build-platforms.json (ex.: ["windows"] durante os ajustes).
      - name: Select build platforms
        id: platforms
        run: |
          node -e "
            const all={windows:{os:'windows-latest',script:'dist:win',name:'windows'},linux:{os:'ubuntu-latest',script:'dist:linux',name:'linux'},macos:{os:'macos-latest',script:'dist:mac',name:'macos'}};
            const list=require('./.github/build-platforms.json');
            console.log('matrix='+JSON.stringify({include:list.map(p=>all[p])}));
          " >> "$GITHUB_OUTPUT"
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Ensure Electron runtime is downloaded
        run: node node_modules/electron/install.js
      - name: Smoke-test Electron (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '. --smoke-test' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Electron smoke test failed: $($process.ExitCode)" }
      - name: Smoke-test Electron (Linux)
        if: matrix.name == 'linux'
        run: xvfb-run -a ./node_modules/electron/dist/electron . --smoke-test --no-sandbox
      - name: Build packages
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Release notes and checksums
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v" - " {p=1} p && /^## / && $0 !~ "^## "v" - " {exit} p' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md
          cd dist && sha256sum $(ls *.exe *.AppImage *.deb *.tar.gz *.dmg 2>/dev/null) > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub release (origin of the files served by www.pt2vhf.com)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.test.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd dist
          current_head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$current_head" != "$RELEASE_COMMIT" ]; then
            echo "A newer main commit exists; its build will publish."
            exit 0
          fi
          # Uma release publicada nunca é sobrescrita: os pacotes já estão no site com SHA-256 fixo.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG já existe; nada a enviar (aumente a versão para publicar)."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "PT2VHF QSL Manager $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" $(ls *.exe *.AppImage *.deb *.tar.gz *.dmg 2>/dev/null) SHA256SUMS.txt
